<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大鱼小筑卖价计算器</title>
<style>
:root {
  --primary: #4f7cff;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #94a3b8;
  --border: #e2e8f0;
}
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  padding: 40px 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
  padding: 32px;
}
h1 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 4px;
}
.sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}
.container > h1,
.container > .sub {
  text-align: center;
}
.table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  min-width: 520px;
  border-collapse: separate;
  border-spacing: 0 10px;
  font-size: 15px;
}
thead th {
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.05em;
  color: var(--muted);
  padding: 0 12px 12px;
  text-align: center;
}
tbody tr {
  background: #fafbfc;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  transition: box-shadow 0.2s;
}
tbody tr:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,0.07);
}
td {
  padding: 16px 12px;
  text-align: center;
  vertical-align: middle;
}
td:first-child {
  font-weight: 500;
  color: var(--text);
  text-align: left;
  padding-left: 20px;
}
input {
  width: 140px;
  padding: 10px 12px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #fff;
  text-align: center;
  outline: none;
  transition: 0.2s;
}
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(79,124,255,0.15);
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  opacity: 1;
}
.sell {
  display: inline-block;
  min-width: 80px;
  padding: 8px 18px;
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  background: linear-gradient(135deg, #eef2ff, #f0f4ff);
  border-radius: 999px;
}
.empty {
  color: var(--muted);
  font-size: 15px;
}
.customer-price {
  display: inline-block;
  min-width: 80px;
  padding: 8px 18px;
  font-size: 18px;
  font-weight: 700;
  color: #b45309;
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border-radius: 999px;
}
.income-display {
  display: inline-block;
  min-width: 80px;
  padding: 8px 18px;
  font-size: 18px;
  font-weight: 700;
  color: #16a34a;
  background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
  border-radius: 999px;
}
.room-name-hidden {
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}
.footer {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 24px;
  user-select: none;
  -webkit-user-select: none;
}
.footer span {
  cursor: default;
}
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1a1a1a;
  color: #fff;
  padding: 12px 28px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active {
  display: flex;
}
.modal-member {
  background: #fff;
  border-radius: 20px;
  padding: 28px 32px 24px;
  width: 640px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
}
.modal-member h2 {
  font-size: 18px;
  margin: 0 0 6px;
  text-align: center;
  color: var(--text);
}
.modal-member .member-hint {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 16px;
}
.modal-member .close-btn {
  position: absolute;
  right: 18px;
  top: 14px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--muted);
  line-height: 1;
}
.member-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.member-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: #fafbfc;
  border-radius: 12px;
}
.member-row .m-name {
  flex: 1;
  font-weight: 500;
}
.member-row select {
  width: 180px;
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #fff;
  outline: none;
  transition: 0.2s;
}
.member-row select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
}
.modal-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}
.modal-actions button {
  padding: 10px 28px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; }
.btn-cancel {
  background: #e2e8f0;
  color: #64748b;
}
.btn-cancel:hover { background: #cbd5e1; }
.modal-password {
  background: #fff;
  border-radius: 20px;
  padding: 32px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  text-align: center;
}
.modal-password { width: 420px; }
.modal-password h2 { font-size: 17px; color: var(--text); margin: 0 0 8px; }
.extra-entry {
  margin-top: 24px;
  text-align: center;
}
.promo-row {
  margin-bottom: 10px;
  text-align: center;
}
.promo-row:last-child { margin-bottom: 0; }
.extra-entry button {
  padding: 9px 18px;
  font-size: 14px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #eef2ff, #f0f4ff);
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
  margin: 0 5px;
}
.extra-entry button:hover { opacity: 0.85; }
#btnSubsidies {
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  color: #b45309;
}
.extra-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 60vh;
  overflow-y: auto;
}
.extra-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: #fafbfc;
  border-radius: 12px;
}
.extra-item .e-info { flex: 1; }
.extra-item .e-name { font-weight: 500; }
.extra-item .e-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.extra-item .e-actions { display: flex; gap: 8px; }
.extra-item .e-actions button {
  padding: 5px 12px;
  font-size: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.extra-item .e-edit { background: #eef2ff; color: var(--primary); }
.extra-item .e-del { background: #fee2e2; color: #ef4444; }
.extra-form { text-align: left; margin-top: 8px; }
.extra-form .modal-field-label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
.extra-form input[type="text"],
.extra-form input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid var(--border);
  box-sizing: border-box;
  outline: none;
}
.extra-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,124,255,0.12); }
.checkbox-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 0;
  max-height: 140px;
  overflow-y: auto;
}
.checkbox-wrap label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  padding: 5px 10px;
  background: #fafbfc;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
}
.checkbox-wrap label input { width: auto; }
.room-wrap label { min-width: 100px; }
.modal-small {
  background: #fff;
  border-radius: 20px;
  padding: 28px 32px 24px;
  width: 340px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  text-align: center;
}
.modal-small h2 { font-size: 17px; color: var(--text); margin: 0 0 16px; }
.modal-small .close-btn {
  position: absolute;
  right: 18px;
  top: 14px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--muted);
  line-height: 1;
}
.modal-field-label {
  display: block;
  font-size: 13px;
  color: #555;
  margin-bottom: 8px;
  text-align: left;
}
.modal-small > input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  box-sizing: border-box;
  margin-bottom: 4px;
}
.modal-password .pw-sub {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 20px;
}
.otp-row {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.otp-box {
  width: 56px;
  height: 60px;
  font-size: 26px;
  font-family: monospace;
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  background: #fff;
  transition: 0.2s;
  box-sizing: border-box;
}
.otp-box:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(79,124,255,0.15);
}
.modal-password .pw-error {
  font-size: 13px;
  color: #ef4444;
  margin-top: 10px;
  min-height: 20px;
}
.history-section {
  margin-top: 20px;
}
.history-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-title .clear-btn {
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  padding: 0;
}
.history-title .clear-btn:hover { color: #ef4444; }
.history-list {
  max-height: 160px;
  overflow-y: auto;
  font-size: 12px;
  color: #64748b;
  text-align: left;
}
.history-list div {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}
.history-list div:last-child { border-bottom: none; }
input.invalid {
  border-color: #ef4444 !important;
  box-shadow: 0 0 0 4px rgba(239,68,68,0.12) !important;
}
@media (max-width: 700px) {
  .container { padding: 20px 12px; }
  table { font-size: 13px; min-width: 480px; }
  td { padding: 10px 6px; }
  td:first-child { padding-left: 10px; }
  input { width: 100px; padding: 8px 6px; font-size: 14px; }
  .sell, .income-display, .customer-price { min-width: 60px; padding: 6px 10px; font-size: 15px; }
  .params-bar { flex-direction: column; align-items: stretch; }
}
</style>
<script>
window.__HOTEL = "dayuxiaozhu";
(function () {
  try {
    var got = new URLSearchParams(window.location.search).get("hotel");
    window.__HOTEL_OK = (got === window.__HOTEL);
  } catch (e) { window.__HOTEL_OK = false; }
})();
</script>
</head>
<body><div id="hotelGate" style="position:fixed;inset:0;z-index:99999;display:none;background:#f5f7fa;align-items:center;justify-content:center;font-family:system-ui;text-align:center;">
  <div>
    <h2 style="margin:0 0 12px;color:#1a1a1a;">页面入口不属于该酒店</h2>
    <p style="color:#94a3b8;margin:0;line-height:1.6;">链接错误或入口被篡改，请联系发放方获取正确的启动器。</p>
  </div>
</div>
<div class="container">
  <h1>大鱼小筑价格调整工具</h1>
  <p class="sub">仅限大鱼小筑携程后台使用</p>
  <div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>房间名称</th>
        <th>应填卖价</th>
        <th>客户实付价</th>
        <th>预期收入</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
  <div class="extra-entry">
    <div class="promo-row">
      <button id="btnBase">基础促销组</button>
      <button id="btnScene">场景促销组</button>
      <button id="btnRedpacket">酒店红包组</button>
      <button id="btnRecharge">充值类促销组</button>
      <button id="btnMemberBtn">优享会</button>
    </div>
    <div class="promo-row">
      <button id="btnSubsidies">携程补贴</button>
      <button id="btnFlash">特惠一口价</button>
    </div>
  </div>
  <div class="history-section">
    <div class="history-title">
      <span>操作记录</span>
      <button class="clear-btn" id="btnClearHistory" style="display:none;">清空记录</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
  <p class="footer" id="footerText">
    <span id="btnCommission">大鱼小筑运维</span>
    ·
    <span id="btnPoints">张之余开发</span>
    ·
    <span id="btnYunti">2026.8.14</span>
  </p>
</div>
<div class="modal-overlay" id="modalCommission">
  <div class="modal-small">
    <button class="close-btn" onclick="auth.closeModal('modalCommission')">✖</button>
    <h2>携程佣金设置</h2>
    <label class="modal-field-label">携程佣金百分比</label>
    <input type="number" id="commissionPct" min="0" max="99.99" step="0.01" placeholder="0" />
    <div class="modal-actions">
      <button class="btn-primary" id="commissionDone">确认</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalPoints">
  <div class="modal-small">
    <button class="close-btn" onclick="auth.closeModal('modalPoints')">✖</button>
    <h2>积分联盟设置</h2>
    <label class="modal-field-label">积分联盟百分比</label>
    <input type="number" id="pointsPct" min="0" max="100" step="0.01" placeholder="0" />
    <div class="modal-actions">
      <button class="btn-primary" id="pointsDone">确认</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalMember">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalMember')">✖</button>
    <h2>会员级别设置</h2>
    <div class="member-hint">为各房型选择对应的会员级别</div>
    <div class="member-list" id="memberList"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="memberDone">完成</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalYunti">
  <div class="modal-small">
    <button class="close-btn" onclick="auth.closeModal('modalYunti')">✖</button>
    <h2>云梯设置</h2>
    <label class="modal-field-label">云梯百分比</label>
    <input type="number" id="yuntiPct" min="0" max="100" step="0.01" placeholder="0" />
    <div class="modal-actions">
      <button class="btn-primary" id="yuntiDone">确认</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalExtras">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalExtras')">✖</button>
    <h2 id="extrasTitle">促销管理</h2>
    <div class="member-hint">多个促销开启时，工具按平台规则自动合并计算</div>
    <div class="extra-list" id="extraList"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="extraAdd">+ 添加</button>
      <button class="btn-cancel" onclick="auth.closeModal('modalExtras')">完成</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalExtraForm">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalExtraForm')">✖</button>
    <h2 id="extraFormTitle">添加</h2>
    <div class="extra-form">
      <label class="modal-field-label" id="extraAmountLabel">优惠名称</label>
      <input type="text" id="extraName" placeholder="请输入名称" />
      <div id="extraPctField">
        <label class="modal-field-label">优惠百分比（%）</label>
        <input type="number" id="extraPct" min="0" step="0.01" placeholder="0" />
      </div>
      <div id="extraRpField" style="display:none">
        <label class="modal-field-label">减免金额 Y（元）</label>
        <input type="number" id="extraRpAmount" min="0" step="0.01" placeholder="0" />
        <label class="modal-field-label">满减门槛 X（元）</label>
        <input type="number" id="extraRpThreshold" min="0" step="0.01" placeholder="0" />
      </div>
      <label class="modal-field-label">应用于哪些房型（多选，默认全部）</label>
      <div class="checkbox-wrap room-wrap" id="extraRoomsWrap"></div>
      <div class="pw-error" id="extraFormError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="extraSave">保存</button>
      <button class="btn-cancel" onclick="auth.closeModal('modalExtraForm')">取消</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalSubsidies">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalSubsidies')">✖</button>
    <h2>携程补贴</h2>
    <div class="member-hint">请自行计算目标时间的携程补贴并填入</div>
    <div class="extra-list" id="subsidyList"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="subsidyAdd">+ 添加补贴</button>
      <button class="btn-cancel" onclick="auth.closeModal('modalSubsidies')">完成</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalSubsidyForm">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalSubsidyForm')">✖</button>
    <h2 id="subsidyFormTitle">添加补贴</h2>
    <div class="extra-form">
      <label class="modal-field-label">补贴名称</label>
      <input type="text" id="subsidyName" placeholder="如：十亿补贴" />
      <label class="modal-field-label">补贴百分比（%）</label>
      <input type="number" id="subsidyPct" min="0" step="0.01" placeholder="0" />
      <label class="modal-field-label">应用于哪些房型（多选，默认全部）</label>
      <div class="checkbox-wrap room-wrap" id="subsidyRoomsWrap"></div>
      <div class="pw-error" id="subsidyFormError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="subsidySave">保存</button>
      <button class="btn-cancel" onclick="auth.closeModal('modalSubsidyForm')">取消</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalFlash">
  <div class="modal-member">
    <button class="close-btn" onclick="auth.closeModal('modalFlash')">✖</button>
    <h2>特惠一口价</h2>
    <div class="member-hint">平台补贴仍然生效</div>
    <div class="extra-form">
      <label class="modal-field-label">优惠名称</label>
      <input type="text" value="特惠一口价" readonly style="color:var(--muted);" />
      <label class="modal-field-label">折扣系数（0-1，如 0.685）</label>
      <input type="number" id="flashPctInp" min="0" max="1" step="0.001" placeholder="0.685" />
      <label class="modal-field-label">应用于哪些房型（多选，默认全部）</label>
      <div class="checkbox-wrap room-wrap" id="flashRoomsWrap"></div>
      <div class="pw-error" id="flashFormError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="flashSave">保存</button>
      <button class="btn-cancel" onclick="auth.closeModal('modalFlash')">取消</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalPassword">

let _wasmInst = null, _wasmReady = false;
async function initWasmCalc() {
  try {
    const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
    const mod = await WebAssembly.compile(bytes);
    const inst = await WebAssembly.instantiate(mod, {});
    _wasmInst = (inst && inst.instance) ? inst.instance.exports : inst.exports;
    _wasmReady = true;
  } catch (e) {
    console.error('WASM init failed', e);
    _wasmReady = false;
  }
}
function wasmCalcRow(req) {
  if (!_wasmInst) return null;
  const json = JSON.stringify(req);
  const body = new TextEncoder().encode(json);
  const bufLen = 4 + body.length + 4096;
  const ptr = _wasmInst.alloc(bufLen);
  const mem = new Uint8Array(_wasmInst.memory.buffer);
  const lenBytes = new Uint8Array(new Uint32Array([body.length]).buffer);
  mem.set(lenBytes, ptr);
  mem.set(body, ptr + 4);
  const ret = _wasmInst.calc_row_json(ptr, bufLen);
  if (ret === 0) { _wasmInst.dealloc(ptr, bufLen); return null; }
  const outLen = new Uint32Array(_wasmInst.memory.buffer.slice(ptr, ptr + 4))[0];
  const outBody = new Uint8Array(_wasmInst.memory.buffer.slice(ptr + 4, ptr + 4 + outLen));
  _wasmInst.dealloc(ptr, bufLen);
  return JSON.parse(new TextDecoder().decode(outBody));
}

    rooms: ex.rooms || []

      flashPct: settings.flashPct,
      yuntiPct: settings.yuntiPct

  };
}
  const PRICE_MAX = 99999999;

    const get = (el) => el ? el.value : "";

    addHistory({ type: "修改云梯", summary: `云梯：${settings.yuntiPct}%` });
  });
  const buildMemberList = () => {
    const container = document.getElementById("memberList");
    container.innerHTML = "";
    rooms.forEach((room, i) => {
      const row = document.createElement("div");
      row.className = "member-row";
      row.innerHTML =
        `<div class="m-name">${room.name}</div>` +
        `<select data-index="${i}">${MEMBER_OPTIONS_HTML()}</select>`;
      container.appendChild(row);
      const sel = row.querySelector("select");
      sel.value = room.member;
      sel.addEventListener("change", () => {
        rooms[i].member = sel.value;
        saveRoomsToStorage();
        refreshAllRows();
      });
    });
  };
  const openMember = () => {
    buildMemberList();
    openModal("modalMember");
  };
  document.getElementById("memberDone").addEventListener("click", () => {
    auth.closeModal("modalMember");
    addHistory({ type: "会员级别设置", summary: "更新了房型会员级别" });
  });
  document.getElementById("btnCommission").addEventListener("click", () => {
    auth.requireAuth(openCommission);
  });
  document.getElementById("btnPoints").addEventListener("click", () => {
    auth.requireAuth(openPoints);
  });
  document.getElementById("btnMemberBtn").addEventListener("click", openMember);
  document.getElementById("btnYunti").addEventListener("click", () => {
    auth.requireAuth(openYunti);
  });
  let currentPromoGroup = "base";
  const PROMO_LABELS = { base: "基础促销组", scene: "场景促销组", redpacket: "酒店红包组", recharge: "充值类促销组" };
  const promoButtons = [
    ["btnBase", "base"],
    ["btnScene", "scene"],
    ["btnRedpacket", "redpacket"],
    ["btnRecharge", "recharge"]
  ];
  const renderExtraList = () => {
    const container = document.getElementById("extraList");
    const list = extras.filter(ex => ex.group === currentPromoGroup);
    if (!list.length) {
      container.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--muted);">暂无促销，点击下方「添加」创建</div>';
      return;
    }
    container.innerHTML = list.map(ex => {
      const roomTxt = (!ex.rooms || !ex.rooms.length || ex.rooms.length >= rooms.length) ? "全部房型" : ex.rooms.join("、");
      const valueTxt = ex.group === "redpacket" ? `满${ex.threshold}减${ex.amount}` : `${ex.pct}%`;
      return `<div class="extra-item">
        <div class="e-info">
          <div class="e-name">${ex.name}（${valueTxt}）</div>
          <div class="e-meta">房型：${roomTxt}</div>
        </div>
        <div class="e-actions">
          <button class="e-edit" data-edit="${ex.id}">修改</button>
          <button class="e-del" data-del="${ex.id}">删除</button>
        </div>
      </div>`;
    }).join("");
  };
  promoButtons.forEach(([id, grp]) => {
    document.getElementById(id).addEventListener("click", () => {
      currentPromoGroup = grp;
      document.getElementById("extrasTitle").textContent = PROMO_LABELS[grp];
      renderExtraList();
      openModal("modalExtras");
    });
  });
  document.getElementById("extraAdd").addEventListener("click", () => openExtraForm(null));
  document.getElementById("extraList").addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-edit]");
    const delBtn = e.target.closest("[data-del]");
    if (editBtn) {
      const ex = extras.find(x => x.id === editBtn.dataset.edit);
      if (ex) openExtraForm(ex);
    } else if (delBtn) {
      const id = delBtn.dataset.del;
      if (confirm("确定删除该促销吗？此操作不可撤销。")) {
        extras = extras.filter(x => x.id !== id);
        saveExtras();
        renderExtraList();
        refreshAllRows();
        showToast("促销已删除");
      }
    }
  });
  let editingExtraId = null;
  const openExtraForm = (ex) => {
    editingExtraId = ex ? ex.id : null;
    const isRp = currentPromoGroup === "redpacket";
    document.getElementById("extraFormTitle").textContent = ex ? "修改优惠详情" : ("添加" + PROMO_LABELS[currentPromoGroup] + "优惠");
    document.getElementById("extraFormError").textContent = "";
    document.getElementById("extraAmountLabel").textContent = isRp ? "红包名称" : "优惠名称";
    document.getElementById("extraName").value = ex ? ex.name : "";
    document.getElementById("extraPctField").style.display = isRp ? "none" : "block";
    document.getElementById("extraRpField").style.display = isRp ? "block" : "none";
    document.getElementById("extraPct").value = (ex && !isRp) ? ex.pct : "";
    document.getElementById("extraRpAmount").value = (ex && isRp) ? ex.amount : "";
    document.getElementById("extraRpThreshold").value = (ex && isRp) ? ex.threshold : "";
    document.getElementById("extraRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${(!ex || !ex.rooms || !ex.rooms.length) ? "checked" : (ex.rooms.indexOf(r.name) !== -1 ? "checked" : "")}>${r.name}</label>`
    ).join("");
    openModal("modalExtraForm");
  };
  document.getElementById("extraSave").addEventListener("click", () => {
    const name = document.getElementById("extraName").value.trim();
    const roomIds = Array.from(document.querySelectorAll("#extraRoomsWrap input:checked")).map(cb => cb.value);
    document.getElementById("extraFormError").textContent = "";
    if (!name) { document.getElementById("extraFormError").textContent = "请输入名称"; return; }
    if (currentPromoGroup === "redpacket") {
      const y = Number(document.getElementById("extraRpAmount").value);
      const x = Number(document.getElementById("extraRpThreshold").value);
      if (isNaN(y) || y < 0) { document.getElementById("extraFormError").textContent = "请输入有效的减免金额 Y"; return; }
      if (isNaN(x) || x < 0) { document.getElementById("extraFormError").textContent = "请输入有效的满减门槛 X"; return; }
      if (editingExtraId) {
        const ex = extras.find(v => v.id === editingExtraId);
        if (ex) { ex.name = name; ex.amount = y; ex.threshold = x; ex.rooms = roomIds; }
      } else {
        extras.push({ id: genId(), name, group: "redpacket", amount: y, threshold: x, rooms: roomIds });
      }
    } else {
      const pct = Number(document.getElementById("extraPct").value);
      if (isNaN(pct) || pct < 0 || pct > 100) { document.getElementById("extraFormError").textContent = "请输入有效的优惠百分比（0-100）"; return; }
      if (editingExtraId) {
        const ex = extras.find(v => v.id === editingExtraId);
        if (ex) { ex.name = name; ex.pct = pct; ex.rooms = roomIds; }
      } else {
        extras.push({ id: genId(), name, pct, group: currentPromoGroup, rooms: roomIds });
      }
    }
    saveExtras();
    auth.closeModal("modalExtraForm");
    renderExtraList();
    refreshAllRows();
    showToast(editingExtraId ? "促销已更新" : "促销已添加");
  });
  const renderSubsidyList = () => {
    const container = document.getElementById("subsidyList");
    if (!subsidies.length) {
      container.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--muted);">暂无补贴，点击下方「添加补贴」创建</div>';
      return;
    }
    container.innerHTML = subsidies.map(s => {
      const roomTxt = (!s.rooms || !s.rooms.length || s.rooms.length >= rooms.length) ? "全部房型" : s.rooms.join("、");
      return `<div class="extra-item">
        <div class="e-info">
          <div class="e-name">${s.name}（${s.pct}%）</div>
          <div class="e-meta">房型：${roomTxt}</div>
        </div>
        <div class="e-actions">
          <button class="e-edit" data-sedit="${s.id}">修改</button>
          <button class="e-del" data-sdel="${s.id}">删除</button>
        </div>
      </div>`;
    }).join("");
  };
  document.getElementById("btnSubsidies").addEventListener("click", () => {
    renderSubsidyList();
    openModal("modalSubsidies");
  });
  document.getElementById("subsidyAdd").addEventListener("click", () => openSubsidyForm(null));
  document.getElementById("subsidyList").addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-sedit]");
    const delBtn = e.target.closest("[data-sdel]");
    if (editBtn) {
      const s = subsidies.find(x => x.id === editBtn.dataset.sedit);
      if (s) openSubsidyForm(s);
    } else if (delBtn) {
      const id = delBtn.dataset.sdel;
      if (confirm("确定删除该补贴吗？此操作不可撤销。")) {
        subsidies = subsidies.filter(x => x.id !== id);
        saveSubsidies();
        renderSubsidyList();
        refreshAllRows();
        showToast("补贴已删除");
      }
    }
  });
  let editingSubsidyId = null;
  const openSubsidyForm = (s) => {
    editingSubsidyId = s ? s.id : null;
    document.getElementById("subsidyFormTitle").textContent = s ? "修改补贴" : "添加补贴";
    document.getElementById("subsidyFormError").textContent = "";
    document.getElementById("subsidyName").value = s ? s.name : "";
    document.getElementById("subsidyPct").value = s ? s.pct : "";
    document.getElementById("subsidyRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${(!s || !s.rooms || !s.rooms.length) ? "checked" : (s.rooms.indexOf(r.name) !== -1 ? "checked" : "")}>${r.name}</label>`
    ).join("");
    openModal("modalSubsidyForm");
  };
  document.getElementById("subsidySave").addEventListener("click", () => {
    const name = document.getElementById("subsidyName").value.trim();
    const pct = Number(document.getElementById("subsidyPct").value);
    const roomIds = Array.from(document.querySelectorAll("#subsidyRoomsWrap input:checked")).map(cb => cb.value);
    if (!name) { document.getElementById("subsidyFormError").textContent = "请输入补贴名称"; return; }
    if (isNaN(pct) || pct < 0 || pct > 100) { document.getElementById("subsidyFormError").textContent = "请输入有效的补贴百分比（0-100）"; return; }
    document.getElementById("subsidyFormError").textContent = "";
    if (editingSubsidyId) {
      const s = subsidies.find(x => x.id === editingSubsidyId);
      if (s) { s.name = name; s.pct = pct; s.rooms = roomIds; }
    } else {
      subsidies.push({ id: genId(), name, pct, rooms: roomIds });
    }
    saveSubsidies();
    auth.closeModal("modalSubsidyForm");
    renderSubsidyList();
    refreshAllRows();
    showToast(editingSubsidyId ? "补贴已更新" : "补贴已添加");
  });
  const openFlash = () => {
    document.getElementById("flashFormError").textContent = "";
    document.getElementById("flashPctInp").value = settings.flashPct || "";
    document.getElementById("flashRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${r.flash ? "checked" : ""}>${r.name}</label>`
    ).join("");
    openModal("modalFlash");
  };
  document.getElementById("btnFlash").addEventListener("click", openFlash);
  document.getElementById("flashSave").addEventListener("click", () => {
    const pct = Number(document.getElementById("flashPctInp").value);
    if (document.getElementById("flashPctInp").value === "" || isNaN(pct) || pct <= 0 || pct >= 1) {
      document.getElementById("flashFormError").textContent = "请输入有效的折扣系数（0-1，不含0和1）";
      return;
    }
    document.getElementById("flashFormError").textContent = "";
    settings.flashPct = pct;
    saveSettings();
    const checked = Array.from(document.querySelectorAll("#flashRoomsWrap input:checked")).map(cb => cb.value);
    rooms.forEach(r => { r.flash = checked.indexOf(r.name) !== -1; });
    saveRoomsToStorage();
    auth.closeModal("modalFlash");
    refreshAllRows();
    showToast("特惠一口价设置已保存");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (document.getElementById("modalPassword").classList.contains("active")) { auth.closePasswordModal(); return; }
    document.querySelectorAll(".modal-overlay.active").forEach(el => el.classList.remove("active"));
  });
  document.querySelectorAll(".modal-overlay").forEach(o => {
    o.addEventListener("click", (e) => { if (e.target === o) { if (o.id === "modalPassword") auth.closePasswordModal(); else o.classList.remove("active"); } });
  });
  const showToast = (msg) => {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  };
  renderHistory();
})();
</script>
</body>
</html>
