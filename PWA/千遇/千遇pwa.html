<script>
const auth = (() => {
  const _close = (id) => { const el = document.getElementById(id); if (el) el.classList.remove("active"); };
  const closeModal = _close;
  const api = { closeModal };
  Object.freeze(api);
  return api;
})();
(function() {
  const safeStore = {
    get(k, fb) { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : fb; } catch { return fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    rawGet(k, fb) { try { const v = localStorage.getItem(k); return v != null ? v : fb; } catch { return fb; } },
    rawSet(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const STORAGE_KEY = "qianyu_rooms_data";
  const SETTINGS_KEY = STORAGE_KEY + "_settings";
  const DATA_VERSION = 2;
  const VERSION_KEY = STORAGE_KEY + "_version";
  const _storedVersion = Number(safeStore.get(VERSION_KEY, 0)) || 0;
  if (_storedVersion < DATA_VERSION) {
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(SETTINGS_KEY);
      localStorage.removeItem(STORAGE_KEY + "_extras");
      localStorage.removeItem(STORAGE_KEY + "_subsidies");
      localStorage.removeItem(STORAGE_KEY + "_history");
    } catch {}
    safeStore.set(VERSION_KEY, DATA_VERSION);
  }
  const MEMBER_TIERS = [
    { key: "silver",  name: "白银贵宾",      discount: 0.05 },
    { key: "gold",    name: "黄金贵宾",      discount: 0.10 },
    { key: "platinum",name: "铂金贵宾",      discount: 0.10 },
    { key: "diamond", name: "钻石贵宾",      discount: 0.15 },
    { key: "jgold",   name: "金钻贵宾",      discount: 0.20 },
    { key: "black",   name: "黑钻及合伙人",  discount: 0.20 },
  ];
  const getTierDiscount = (key) => {
    const t = MEMBER_TIERS.find(x => x.key === key);
    return t ? t.discount : 0;
  };
  const MEMBER_OPTIONS_HTML = () =>
    MEMBER_TIERS.map(t => `<option value="${t.key}">${t.name}（${Math.round(t.discount * 100)}%）</option>`).join("");
  const loadRoomsFromStorage = () => safeStore.get(STORAGE_KEY, null);
  const saveRoomsToStorage = () => { safeStore.set(STORAGE_KEY, rooms.map(r => ({ name: r.name, member: r.member, flash: !!r.flash }))); };
  const defaultRooms = [
    { name: "全海景套房",     member: "gold" },
    { name: "全海景大床房",   member: "gold" },
    { name: "全海景双卧套房", member: "gold" },
    { name: "独享庭院",       member: "gold" },
    { name: "舒适双卧套房",   member: "gold" },
    { name: "舒适大床房",     member: "gold" },
    { name: "舒适套房",       member: "gold" },
    { name: "全海景亲子房",   member: "gold" },
    { name: "舒适亲子房",     member: "gold" },
  ];
  const savedRooms = loadRoomsFromStorage();
  let rooms = JSON.parse(JSON.stringify(defaultRooms));
  const isValidTier = (k) => MEMBER_TIERS.some(t => t.key === k);
  if (Array.isArray(savedRooms)) {
    rooms.forEach(r => {
      const sr = savedRooms.find(s => s && typeof s === "object" && s.name === r.name);
      if (!sr) return;
      if (isValidTier(sr.member)) r.member = sr.member;
      if (typeof sr.flash === "boolean") r.flash = sr.flash;
    });
  }
  const DEFAULT_SETTINGS = { commissionPct: 12, pointsPct: 5, flashPct: 0, yuntiPct: 2 };
  const _rawSettings = safeStore.get(SETTINGS_KEY, null);
  const settings = { commissionPct: DEFAULT_SETTINGS.commissionPct, pointsPct: DEFAULT_SETTINGS.pointsPct, flashPct: DEFAULT_SETTINGS.flashPct, yuntiPct: DEFAULT_SETTINGS.yuntiPct };
  if (_rawSettings && typeof _rawSettings === "object") {
    const cc = Number(_rawSettings.commissionPct);
    const pp = Number(_rawSettings.pointsPct);
    const fp = Number(_rawSettings.flashPct);
    const yp = Number(_rawSettings.yuntiPct);
    settings.commissionPct = (!isNaN(cc) && cc >= 0 && cc < 100) ? cc : DEFAULT_SETTINGS.commissionPct;
    settings.pointsPct = (!isNaN(pp) && pp >= 0 && pp <= 100) ? pp : DEFAULT_SETTINGS.pointsPct;
    settings.flashPct = (!isNaN(fp) && fp >= 0 && fp <= 1) ? fp : DEFAULT_SETTINGS.flashPct;
    settings.yuntiPct = (!isNaN(yp) && yp >= 0 && yp <= 100) ? yp : DEFAULT_SETTINGS.yuntiPct;
  }
  const saveSettings = () => safeStore.set(SETTINGS_KEY, settings);
  const EXTRAS_KEY = STORAGE_KEY + "_extras";
  const validGroups = ["base", "scene", "recharge", "redpacket"];
  const DEFAULT_PROMOS = [
    { name: "天天特价", pct: 0, group: "base" },
    { name: "节日全覆盖", pct: 0, group: "base" },
    { name: "错峰全覆盖", pct: 0, group: "base" },
    { name: "时令全覆盖", pct: 0, group: "base" },
    { name: "超级周边游", pct: 0, group: "base" },
    { name: "超级上新日", pct: 0, group: "base" },
    { name: "开业特惠", pct: 0, group: "base" },
    { name: "提前预订", pct: 0, group: "scene" },
    { name: "连住优惠", pct: 0, group: "scene" },
    { name: "今夜甩卖", pct: 0, group: "scene" },
    { name: "限时抢购", pct: 0, group: "scene" },
    { name: "钟点房促销", pct: 0, group: "scene" },
    { name: "多间/多日立减", pct: 0, group: "scene" },
    { name: "门店新客", pct: 0, group: "scene" },
    { name: "出行特惠", pct: 0, group: "scene" },
    { name: "学生专享", pct: 0, group: "scene" },
    { name: "本地特惠红包", amount: 0, threshold: 0, group: "redpacket" },
    { name: "意向挽留红包", amount: 0, threshold: 0, group: "redpacket" },
    { name: "动态返现", pct: 0, group: "recharge" },
    { name: "智选特惠", pct: 0, group: "recharge" },
  ];
  const normExtras = (list) => (Array.isArray(list) ? list : []).filter(x => x && typeof x === "object" && x.id).map(ex => {
    const g = validGroups.indexOf(ex.group) !== -1 ? ex.group : "base";
    const base = {
      id: String(ex.id),
      name: typeof ex.name === "string" ? ex.name : "未命名优惠",
      group: g,
      rooms: Array.isArray(ex.rooms) ? ex.rooms.filter(s => typeof s === "string") : []
    };
    if (g === "redpacket") {
      const y = Number(ex.amount);
      const x = Number(ex.threshold);
      base.amount = (isNaN(y) || y < 0) ? 0 : y;
      base.threshold = (isNaN(x) || x < 0) ? 0 : x;
    } else {
      const p = Number(ex.pct);
      base.pct = (isNaN(p) || p < 0 || p > 100) ? 0 : p;
    }
    return base;
  });
  const _savedExtras = safeStore.get(EXTRAS_KEY, null);
  let extras;
  if (_savedExtras === null) {
    const allRoomNames = rooms.map(r => r.name);
    extras = DEFAULT_PROMOS.map((d, i) => ({ id: "d" + i, name: d.name, group: d.group, rooms: allRoomNames.slice(), ...(d.group === "redpacket" ? { amount: d.amount, threshold: d.threshold } : { pct: d.pct }) }));
  } else {
    extras = normExtras(_savedExtras);
  }
  const saveExtras = () => safeStore.set(EXTRAS_KEY, extras);
  const genId = () => "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const extraAppliesTo = (ex, roomName) => Array.isArray(ex.rooms) && ex.rooms.indexOf(roomName) !== -1;
  const SUBSIDIES_KEY = STORAGE_KEY + "_subsidies";
  const rawSubsidies = safeStore.get(SUBSIDIES_KEY, []);
  let subsidies = (Array.isArray(rawSubsidies) ? rawSubsidies : []).filter(x => x && typeof x === "object" && x.id).map(s => {
    const p = Number(s.pct);
    return {
      id: String(s.id),
      name: typeof s.name === "string" ? s.name : "未命名补贴",
      pct: (isNaN(p) || p < 0 || p > 100) ? 0 : p,
      rooms: Array.isArray(s.rooms) ? s.rooms.filter(r => typeof r === "string") : []
    };
  });
  const saveSubsidies = () => safeStore.set(SUBSIDIES_KEY, subsidies);
  const subsidyAppliesTo = (s, roomName) => Array.isArray(s.rooms) && s.rooms.indexOf(roomName) !== -1;
  const calcSubsidyPct = (roomName) => {
    if (!subsidies.length) return 0;
    return subsidies.reduce((sum, s) => sum + (subsidyAppliesTo(s, roomName) ? (Number(s.pct) || 0) : 0), 0);
  };
  let history = safeStore.get(STORAGE_KEY + "_history", []);
  const saveHistory = () => { safeStore.set(STORAGE_KEY + "_history", history); };
  const addHistory = (record) => {
    const entry = { type: record.type, time: new Date().toLocaleString("zh-CN"), ...(record.summary && { summary: record.summary }) };
    history.unshift(entry);
    if (history.length > 50) history.length = 50;
    saveHistory();
    renderHistory();
  };
  const renderHistory = () => {
    const el = document.getElementById("historyList");
    const btnClear = document.getElementById("btnClearHistory");
    if (!history.length) {
      el.innerHTML = '<div style="text-align:center;padding:12px 0;">暂无操作记录</div>';
      btnClear.style.display = "none";
      return;
    }
    btnClear.style.display = "";
    el.innerHTML = history.map(h => `<div>${h.time} · ${h.type}${h.summary ? ` · ${h.summary}` : ""}</div>`).join("");
  };
  document.getElementById("btnClearHistory").addEventListener("click", () => {
    if (history.length === 0) return;
    if (confirm("确定要清空所有历史记录吗？此操作不可撤销。")) {
      history = [];
      saveHistory();
      renderHistory();
      showToast("历史记录已清空");
    }
  });
  const isFlash = (roomName) => {
    const r = rooms.find(x => x.name === roomName);
    return !!(r && r.flash);
  };
  const PROMO_GROUPS = ["base", "scene", "recharge"];
  const applicablePromos = (roomName) => extras.filter(ex => ex.group !== "redpacket" && extraAppliesTo(ex, roomName));
  const redpacketValueFromT = (T, roomName) => {
    const rps = extras.filter(ex => ex.group === "redpacket" && extraAppliesTo(ex, roomName));
    if (!rps.length) return 0;
    let best = 0;
    rps.forEach(ex => {
      if (T >= (ex.threshold || 0) && (ex.amount || 0) > best) best = ex.amount;
    });
    return best;
  };
  const calcBuyPcts = (roomName, memberKey) => {
    if (isFlash(roomName)) {
      const coef = Number(settings.flashPct) || 0;
      const fp = (1 - coef) * 100;
      return fp > 0 ? [fp] : [0];
    }
    const pcts = [getTierDiscount(memberKey) * 100];
    const applicable = applicablePromos(roomName);
    PROMO_GROUPS.forEach(grp => {
      const inGrp = applicable.filter(ex => ex.group === grp);
      if (!inGrp.length) return;
      let best = 0;
      inGrp.forEach(ex => { const p = Number(ex.pct) || 0; if (p > best) best = p; });
      pcts.push(best);
    });
    return pcts;
  };
  const targetFromSell = (S, buyPcts, roomName) => {
    let T = S;
    buyPcts.forEach(p => { T -= Math.ceil(S * p / 100); });
    if (roomName) T -= redpacketValueFromT(T, roomName);
    return T;
  };
  const subsidyValueFromSell = (S, roomName, buyPcts) => {
    const sp = calcSubsidyPct(roomName);
    if (sp <= 0) return 0;
    if (isFlash(roomName)) {
      const T = targetFromSell(S, buyPcts, roomName);
      return Math.ceil(T * sp / 100);
    }
    return Math.ceil(S * sp / 100);
  };
  const customerPriceFromSell = (S, roomName, buyPcts) => {
    return targetFromSell(S, buyPcts, roomName) - subsidyValueFromSell(S, roomName, buyPcts);
  };
  const incomeFromSell = (S, roomName, buyPcts, commissionPct, pointsPct, yuntiPct) => {
    const T = targetFromSell(S, buyPcts, roomName);
    const c = Number(commissionPct);
    const p = Number(pointsPct);
    const y = Number(yuntiPct);
    if (isNaN(c) || c >= 100 || c < 0) return NaN;
    if (isNaN(p) || p < 0 || p > 100) return NaN;
    if (isNaN(y) || y < 0 || y > 100) return NaN;
    const base = T * (1 - c / 100);
    const income = base - Math.ceil(base * p / 100) - Math.ceil(base * y / 100);
    return Math.round(income * 100) / 100;
  };
  const solveSellFromCustomerPrice = (cp, roomName, memberKey) => {
    const CP = Number(cp);
    if (isNaN(CP) || CP <= 0) return NaN;
    const buyPcts = calcBuyPcts(roomName, memberKey);
    const f = (S) => customerPriceFromSell(S, roomName, buyPcts);
    let lo = 0, hi = Math.max(CP, 1);
    while (f(hi) < CP && hi < PRICE_MAX * 2) hi *= 2;
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) < CP) lo = mid; else hi = mid;
    }
    const S0 = Math.round(hi);
    let best = null, bestDelta = Infinity;
    for (let d = -8; d <= 8; d++) {
      const S = S0 + d;
      if (S < 0) continue;
      const delta = Math.abs(f(S) - CP);
      if (delta < bestDelta) { bestDelta = delta; best = S; }
    }
    return (bestDelta === 0) ? best : (best !== null ? best : NaN);
  };
  const solveSellFromIncome = (income, roomName, memberKey, commissionPct, pointsPct) => {
    const inc = Number(income);
    if (isNaN(inc) || inc <= 0) return NaN;
    const buyPcts = calcBuyPcts(roomName, memberKey);
    const c = Number(commissionPct), p = Number(pointsPct);
    if (isNaN(c) || c >= 100 || c < 0) return NaN;
    if (isNaN(p) || p < 0 || p > 100) return NaN;
    const f = (S) => incomeFromSell(S, roomName, buyPcts, c, p, settings.yuntiPct);
    let lo = 0, hi = Math.max(inc, 1) * 5;
    while (f(hi) < inc && hi < PRICE_MAX * 2) hi *= 2;
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) < inc) lo = mid; else hi = mid;
    }
    const S0 = Math.round(hi);
    let best = null, bestDelta = Infinity;
    for (let d = -20; d <= 20; d++) {
      const S = S0 + d;
      if (S < 0) continue;
      const delta = Math.abs(f(S) - inc);
      if (delta < bestDelta) { bestDelta = delta; best = S; }
    }
    return best !== null ? best : NaN;
  };
  const verifyCustomerPrice = (S, roomName, memberKey) => {
    const buyPcts = calcBuyPcts(roomName, memberKey);
    return customerPriceFromSell(S, roomName, buyPcts);

    auth.closeModal("modalPoints");
    addHistory({ type: "修改积分联盟", summary: `积分联盟：${settings.pointsPct}%` });
  });
  const openYunti = () => {
    yuntiInp.value = settings.yuntiPct;
    openModal("modalYunti");
  };
  yuntiInp.addEventListener("input", () => {
    const n = Number(yuntiInp.value);
    settings.yuntiPct = (yuntiInp.value !== "" && !isNaN(n) && n >= 0 && n <= 100) ? n : 0;
    saveSettings();
    refreshAllRows();
  });
  document.getElementById("yuntiDone").addEventListener("click", () => {
    auth.closeModal("modalYunti");
    addHistory({ type: "修改云梯", summary: `云梯：${settings.yuntiPct}%` });
  });
  const buildMemberList = () => {
    const container = document.getElementById("memberList");
    container.innerHTML = "";
    rooms.forEach((room, i) => {
      const row = document.createElement("div");
      row.className = "member-row";
      row.innerHTML =
        `<div class="m-name">${room.name}</div>` +
        `<select data-index="${i}">${MEMBER_OPTIONS_HTML()}</select>`;
      container.appendChild(row);
      const sel = row.querySelector("select");
      sel.value = room.member;
      sel.addEventListener("change", () => {
        rooms[i].member = sel.value;
        saveRoomsToStorage();
        refreshAllRows();
      });
    });
  };
  const openMember = () => {
    buildMemberList();
    openModal("modalMember");
  };
  document.getElementById("memberDone").addEventListener("click", () => {
    auth.closeModal("modalMember");
    addHistory({ type: "会员级别设置", summary: "更新了房型会员级别" });
  });
  document.getElementById("btnCommission").addEventListener("click", openCommission);
  document.getElementById("btnPoints").addEventListener("click", openPoints);
  document.getElementById("btnMemberBtn").addEventListener("click", openMember);
  document.getElementById("btnYunti").addEventListener("click", openYunti);
  let currentPromoGroup = "base";
  const PROMO_LABELS = { base: "基础促销组", scene: "场景促销组", redpacket: "酒店红包组", recharge: "充值类促销组" };
  const promoButtons = [
    ["btnBase", "base"],
    ["btnScene", "scene"],
    ["btnRedpacket", "redpacket"],
    ["btnRecharge", "recharge"]
  ];
  const renderExtraList = () => {
    const container = document.getElementById("extraList");
    const list = extras.filter(ex => ex.group === currentPromoGroup);
    if (!list.length) {
      container.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--muted);">暂无促销，点击下方「添加」创建</div>';
      return;
    }
    container.innerHTML = list.map(ex => {
      const roomTxt = (!ex.rooms || !ex.rooms.length || ex.rooms.length >= rooms.length) ? "全部房型" : ex.rooms.join("、");
      const valueTxt = ex.group === "redpacket" ? `满${ex.threshold}减${ex.amount}` : `${ex.pct}%`;
      return `<div class="extra-item">
        <div class="e-info">
          <div class="e-name">${ex.name}（${valueTxt}）</div>
          <div class="e-meta">房型：${roomTxt}</div>
        </div>
        <div class="e-actions">
          <button class="e-edit" data-edit="${ex.id}">修改</button>
          <button class="e-restore" data-restore="${ex.id}">复原</button>
        </div>
      </div>`;
    }).join("");
  };
  promoButtons.forEach(([id, grp]) => {
    document.getElementById(id).addEventListener("click", () => {
      currentPromoGroup = grp;
      document.getElementById("extrasTitle").textContent = PROMO_LABELS[grp];
      renderExtraList();
      openModal("modalExtras");
    });
  });
  document.getElementById("extraList").addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-edit]");
    const restoreBtn = e.target.closest("[data-restore]");
    if (editBtn) {
      const ex = extras.find(x => x.id === editBtn.dataset.edit);
      if (ex) openExtraForm(ex);
    } else if (restoreBtn) {
      const ex = extras.find(x => x.id === restoreBtn.dataset.restore);
      if (ex) {
        const def = DEFAULT_PROMOS.find(d => d.name === ex.name && d.group === ex.group);
        const allNames = rooms.map(r => r.name);
        if (def) {
          if (ex.group === "redpacket") {
            ex.amount = Number(def.amount) || 0;
            ex.threshold = Number(def.threshold) || 0;
          } else {
            ex.pct = Number(def.pct) || 0;
          }
        } else {
          if (ex.group === "redpacket") { ex.amount = 0; ex.threshold = 0; }
          else { ex.pct = 0; }
        }
        ex.rooms = allNames.slice();
        saveExtras();
        renderExtraList();
        refreshAllRows();
        showToast("已复原为默认值");
      }
    }
  });
  let editingExtraId = null;
  const openExtraForm = (ex) => {
    editingExtraId = ex ? ex.id : null;
    const isRp = currentPromoGroup === "redpacket";
    document.getElementById("extraFormTitle").textContent = "修改优惠详情";
    document.getElementById("extraFormError").textContent = "";
    document.getElementById("extraAmountLabel").textContent = isRp ? "红包名称" : "优惠名称";
    document.getElementById("extraName").value = ex ? ex.name : "";
    document.getElementById("extraPctField").style.display = isRp ? "none" : "block";
    document.getElementById("extraRpField").style.display = isRp ? "block" : "none";
    document.getElementById("extraPct").value = (ex && !isRp) ? ex.pct : "";
    document.getElementById("extraRpAmount").value = (ex && isRp) ? ex.amount : "";
    document.getElementById("extraRpThreshold").value = (ex && isRp) ? ex.threshold : "";
    document.getElementById("extraRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${(!ex || !ex.rooms || !ex.rooms.length) ? "checked" : (ex.rooms.indexOf(r.name) !== -1 ? "checked" : "")}>${r.name}</label>`
    ).join("");
    openModal("modalExtraForm");
  };
  document.getElementById("extraSave").addEventListener("click", () => {
    const name = document.getElementById("extraName").value.trim();
    const roomIds = Array.from(document.querySelectorAll("#extraRoomsWrap input:checked")).map(cb => cb.value);
    document.getElementById("extraFormError").textContent = "";
    if (!name) { document.getElementById("extraFormError").textContent = "请输入名称"; return; }
    if (currentPromoGroup === "redpacket") {
      const y = Number(document.getElementById("extraRpAmount").value);
      const x = Number(document.getElementById("extraRpThreshold").value);
      if (isNaN(y) || y < 0) { document.getElementById("extraFormError").textContent = "请输入有效的减免金额 Y"; return; }
      if (isNaN(x) || x < 0) { document.getElementById("extraFormError").textContent = "请输入有效的满减门槛 X"; return; }
      const ex = extras.find(v => v.id === editingExtraId);
      if (ex) { ex.name = name; ex.amount = y; ex.threshold = x; ex.rooms = roomIds; }
    } else {
      const pct = Number(document.getElementById("extraPct").value);
      if (isNaN(pct) || pct < 0 || pct > 100) { document.getElementById("extraFormError").textContent = "请输入有效的优惠百分比（0-100）"; return; }
      const ex = extras.find(v => v.id === editingExtraId);
      if (ex) { ex.name = name; ex.pct = pct; ex.rooms = roomIds; }
    }
    saveExtras();
    auth.closeModal("modalExtraForm");
    renderExtraList();
    refreshAllRows();
    showToast("促销已更新");
  });
  const renderSubsidyList = () => {
    const container = document.getElementById("subsidyList");
    if (!subsidies.length) {
      container.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--muted);">暂无补贴，点击下方「添加补贴」创建</div>';
      return;
    }
    container.innerHTML = subsidies.map(s => {
      const roomTxt = (!s.rooms || !s.rooms.length || s.rooms.length >= rooms.length) ? "全部房型" : s.rooms.join("、");
      return `<div class="extra-item">
        <div class="e-info">
          <div class="e-name">${s.name}（${s.pct}%）</div>
          <div class="e-meta">房型：${roomTxt}</div>
        </div>
        <div class="e-actions">
          <button class="e-edit" data-sedit="${s.id}">修改</button>
          <button class="e-del" data-sdel="${s.id}">删除</button>
        </div>
      </div>`;
    }).join("");
  };
  document.getElementById("btnSubsidies").addEventListener("click", () => {
    renderSubsidyList();
    openModal("modalSubsidies");
  });
  document.getElementById("subsidyAdd").addEventListener("click", () => openSubsidyForm(null));
  document.getElementById("subsidyList").addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-sedit]");
    const delBtn = e.target.closest("[data-sdel]");
    if (editBtn) {
      const s = subsidies.find(x => x.id === editBtn.dataset.sedit);
      if (s) openSubsidyForm(s);
    } else if (delBtn) {
      const id = delBtn.dataset.sdel;
      if (confirm("确定删除该补贴吗？此操作不可撤销。")) {
        subsidies = subsidies.filter(x => x.id !== id);
        saveSubsidies();
        renderSubsidyList();
        refreshAllRows();
        showToast("补贴已删除");
      }
    }
  });
  let editingSubsidyId = null;
  const openSubsidyForm = (s) => {
    editingSubsidyId = s ? s.id : null;
    document.getElementById("subsidyFormTitle").textContent = s ? "修改补贴" : "添加补贴";
    document.getElementById("subsidyFormError").textContent = "";
    document.getElementById("subsidyName").value = s ? s.name : "";
    document.getElementById("subsidyPct").value = s ? s.pct : "";
    document.getElementById("subsidyRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${(!s || !s.rooms || !s.rooms.length) ? "checked" : (s.rooms.indexOf(r.name) !== -1 ? "checked" : "")}>${r.name}</label>`
    ).join("");
    openModal("modalSubsidyForm");
  };
  document.getElementById("subsidySave").addEventListener("click", () => {
    const name = document.getElementById("subsidyName").value.trim();
    const pct = Number(document.getElementById("subsidyPct").value);
    const roomIds = Array.from(document.querySelectorAll("#subsidyRoomsWrap input:checked")).map(cb => cb.value);
    if (!name) { document.getElementById("subsidyFormError").textContent = "请输入补贴名称"; return; }
    if (isNaN(pct) || pct < 0 || pct > 100) { document.getElementById("subsidyFormError").textContent = "请输入有效的补贴百分比（0-100）"; return; }
    document.getElementById("subsidyFormError").textContent = "";
    if (editingSubsidyId) {
      const s = subsidies.find(x => x.id === editingSubsidyId);
      if (s) { s.name = name; s.pct = pct; s.rooms = roomIds; }
    } else {
      subsidies.push({ id: genId(), name, pct, rooms: roomIds });
    }
    saveSubsidies();
    auth.closeModal("modalSubsidyForm");
    renderSubsidyList();
    refreshAllRows();
    showToast(editingSubsidyId ? "补贴已更新" : "补贴已添加");
  });
  const openFlash = () => {
    document.getElementById("flashFormError").textContent = "";
    document.getElementById("flashPctInp").value = settings.flashPct || "";
    document.getElementById("flashRoomsWrap").innerHTML = rooms.map(r =>
      `<label><input type="checkbox" value="${r.name}" ${r.flash ? "checked" : ""}>${r.name}</label>`
    ).join("");
    openModal("modalFlash");
  };
  document.getElementById("btnFlash").addEventListener("click", openFlash);
  document.getElementById("flashSave").addEventListener("click", () => {
    const pct = Number(document.getElementById("flashPctInp").value);
    if (document.getElementById("flashPctInp").value === "" || isNaN(pct) || pct <= 0 || pct >= 1) {
      document.getElementById("flashFormError").textContent = "请输入有效的折扣系数（0-1，不含0和1）";
      return;
    }
    document.getElementById("flashFormError").textContent = "";
    settings.flashPct = pct;
    saveSettings();
    const checked = Array.from(document.querySelectorAll("#flashRoomsWrap input:checked")).map(cb => cb.value);
    rooms.forEach(r => { r.flash = checked.indexOf(r.name) !== -1; });
    saveRoomsToStorage();
    auth.closeModal("modalFlash");
    refreshAllRows();
    showToast("特惠一口价设置已保存");
  });
  const allRoomNames = () => (rooms || []).map(r => r.name);
  const fmtRooms = (arr) => {
    if (!Array.isArray(arr) || !arr.length) return "全部";
    const all = allRoomNames();
    if (all.length && arr.length >= all.length && all.every(n => arr.indexOf(n) !== -1)) return "全部";
    return arr.join(",");
  };
  const parseRooms = (s) => {
    if (!s || s.trim() === "全部") return [];
    return s.split(/[,，]/).map(x => x.trim()).filter(Boolean);
  };
  const exportPromos = () => {
    const lines = [];
    (extras || []).forEach(ex => {
      if (ex.group === "redpacket") {
        if (Number(ex.amount) > 0) lines.push(`[红包] ${ex.name} | 满${Number(ex.threshold) || 0}减${Number(ex.amount)} | ${fmtRooms(ex.rooms)}`);
      } else {
        if (Number(ex.pct) > 0) lines.push(`[促销] ${ex.name} | 折扣${Number(ex.pct)}% | ${fmtRooms(ex.rooms)}`);
      }
    });
    (subsidies || []).forEach(s => {
      if (Number(s.pct) > 0) lines.push(`[补贴] ${s.name} | 折扣${Number(s.pct)}% | ${fmtRooms(s.rooms)}`);
    });
    const flashRooms = (rooms || []).filter(r => r.flash).map(r => r.name);
    if (flashRooms.length && Number(settings.flashPct) > 0) {
      lines.push(`[特惠] 特惠一口价 | 系数${Number(settings.flashPct)} | ${fmtRooms(flashRooms)}`);
    }
    const memberLines = (rooms || []).filter(r => r.member).map(r => {
      const t = MEMBER_TIERS.find(x => x.key === r.member);
      return t ? `${r.name}:${t.name}` : null;
    }).filter(Boolean);
    if (memberLines.length) lines.push(`[优享会] 会员设置 | ${memberLines.join(",")}`);
    return lines.join("\n");
  };
  const doExport = () => {
    const text = exportPromos();
    if (!text) { showToast("没有已设置的优惠"); return; }
    const done = () => showToast("优惠已复制，可粘贴到导入");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  };
  const doImport = () => {
    const raw = document.getElementById("importText").value || "";
    const errEl = document.getElementById("importError");
    let matched = 0, unmatched = 0, subsCleared = false;
    raw.split(/\n+/).forEach(line => {
      const m = line.trim().match(/^\[(促销|红包|补贴|特惠|优享会)\]\s*(.+?)\s*\|\s*(.+?)(?:\s*\|\s*(.*))?$/);
      if (!m) return;
      const type = m[1], name = m[2].trim(), val = m[3].trim(), roomsStr = (m[4] || "").trim();
      const roomArr = parseRooms(roomsStr);
      if (type === "优享会") {
        let ok = 0;
        val.split(/[,，]/).map(x => x.trim()).filter(Boolean).forEach(p => {
          const mm = p.match(/^(.+?)[:：](.+)$/);
          if (!mm) return;
          const rn = mm[1].trim(), tn = mm[2].trim();
          const t = MEMBER_TIERS.find(x => x.name === tn);
          const r = rooms.find(rr => rr.name === rn);
          if (t && r) { r.member = t.key; ok++; }
        });
        if (ok) { saveRoomsToStorage(); matched += ok; }
        else unmatched++;
        return;
      }
      if (type === "特惠") {
        const k = parseFloat(val.replace(/[^0-9.]/g, ""));
        if (!isNaN(k) && k > 0 && k < 1) {
          settings.flashPct = k; saveSettings();
          if (roomArr.length) rooms.forEach(r => { if (roomArr.indexOf(r.name) !== -1) r.flash = true; });
          else rooms.forEach(r => { r.flash = true; });
          saveRoomsToStorage(); matched++;
        } else unmatched++;
        return;
      }
      if (type === "补贴") {
        const p = parseFloat(val.replace(/[^0-9.]/g, ""));
        if (isNaN(p)) { unmatched++; return; }
        if (!subsCleared) { subsidies = []; subsCleared = true; }
        subsidies.push({ id: genId(), name, pct: p, rooms: roomArr });
        saveSubsidies(); matched++;
        return;
      }
      const ex = extras.find(x => x.name === name);
      if (!ex) { unmatched++; return; }
      if (type === "红包") {
        const mm = val.match(/满\s*([0-9.]+)\s*减\s*([0-9.]+)/);
        if (mm) { ex.threshold = parseFloat(mm[1]); ex.amount = parseFloat(mm[2]); ex.rooms = roomArr; saveExtras(); matched++; }
        else { unmatched++; }
      } else {
        const p = parseFloat(val.replace(/[^0-9.]/g, ""));
        if (isNaN(p)) { unmatched++; return; }
        ex.pct = p; ex.rooms = roomArr; saveExtras(); matched++;
      }
    });
    if (typeof renderExtraList === "function") renderExtraList();
    if (typeof renderSubsidyList === "function") renderSubsidyList();
    refreshAllRows();
    const ml = document.getElementById("memberList");
    if (ml && ml.children.length) buildMemberList();
    auth.closeModal("modalImport");
    showToast(matched ? (`已导入 ${matched} 项` + (unmatched ? `，${unmatched} 项未匹配` : "")) : "没有匹配到优惠");
  };
  const openImport = () => {
    document.getElementById("importError").textContent = "";
    document.getElementById("importText").value = "";
    openModal("modalImport");
  };
  const btnExport = document.getElementById("btnExport");
  const btnImport = document.getElementById("btnImport");
  if (btnExport) btnExport.addEventListener("click", doExport);
  if (btnImport) btnImport.addEventListener("click", openImport);
  const importConfirm = document.getElementById("importConfirm");
  const importCancel = document.getElementById("importCancel");
  if (importConfirm) importConfirm.addEventListener("click", doImport);
  if (importCancel) importCancel.addEventListener("click", () => auth.closeModal("modalImport"));
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    var actives = document.querySelectorAll(".modal-overlay.active");
    if (actives.length) actives[actives.length - 1].classList.remove("active");
  });
  document.querySelectorAll(".modal-overlay").forEach(o => {
    o.addEventListener("click", (e) => { if (e.target === o) o.classList.remove("active"); });
  });
  const showToast = (msg) => {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  };
  renderHistory();
  const btnCopy = document.getElementById("btnCopy");
  if (btnCopy) {
    btnCopy.addEventListener("click", function () {
      const lines = (rooms || []).map((room, i) => {
        const sellEl = document.getElementById("sell-" + i);
        const cInp = document.querySelector(`input[data-index="${i}"][data-col="customer"]`);
        const name = room && room.name ? room.name : "";
        const sell = sellEl ? sellEl.textContent.trim() : "";
        const customer = cInp ? cInp.value.trim() : "";
        return name + " / " + sell + " / " + customer;
      });
      const dFrom = (document.getElementById("dateFrom") || {}).value || "";
      const dTo = (document.getElementById("dateTo") || {}).value || "";
      const header = "千遇酒店「" + dFrom + "」到「" + dTo + "」：";
      const text = lines.length ? (header + "\n" + lines.join("\n")) : header;
      const done = () => showToast("输入与计算结果已复制");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    });
  }
  function fallbackCopy(text, cb) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    cb && cb();
  }
})();
</script>
<script>
(function () {
  var menu = document.getElementById("promoMenu");
  var entry = document.getElementById("btnPromoEntry");
  var done = document.getElementById("pmDone");
  if (!menu || !entry) return;
  entry.addEventListener("click", function () { menu.classList.add("active"); });
  if (done) done.addEventListener("click", function () { menu.classList.remove("active"); });
  menu.querySelectorAll(".pm-item").forEach(function (item) {
    item.addEventListener("click", function () {
      var target = item.getAttribute("data-target");
      var btn = document.getElementById(target);
      if (btn) btn.click();
    });
  });
})();
(function () {
  if (!("serviceWorker" in navigator)) return;
  var regRef = null;
  var attempt = 0;
  function scheduleRetry() {
    attempt++;
    var delay = Math.min(300000, 5000 * Math.pow(2, attempt - 1));
    setTimeout(silentUpdate, delay);
  }
  function silentUpdate() {
    if (!regRef) return;
    var reg = regRef;
    var applied = false;
    reg.onupdatefound = function () {
      var installing = reg.installing;
      if (!installing) return;
      installing.onstatechange = function () {
        if (installing.state === "installed") {
          if (navigator.serviceWorker.controller) {
            installing.postMessage({ type: "SKIP_WAITING" });
          }
        } else if (installing.state === "activated") {
          if (applied) return;
          applied = true;
          location.reload();
        }
      };
    };
    reg.update().then(function () {
    }).catch(function () {
      scheduleRetry();
    });
  }
  navigator.serviceWorker.register("./sw.js").then(function (reg) {
    regRef = reg;
    if (navigator.serviceWorker.controller) {
      silentUpdate();
    }
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      attempt = 0;
      silentUpdate();
    });
  }).catch(function () {
  });
})();
</script>
